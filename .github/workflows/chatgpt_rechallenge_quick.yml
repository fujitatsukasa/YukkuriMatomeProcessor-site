name: ChatGPT Rechallenge Tokyo quick screens

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/capture_rechallenge_quick.py'
      - '.github/workflows/chatgpt_rechallenge_quick.yml'

permissions:
  contents: read

jobs:
  capture-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture real source pages
        run: python scripts/capture_rechallenge_quick.py
      - name: Upload quick source captures
        uses: actions/upload-artifact@v4
        with:
          name: rechallenge-tokyo-quick-screens
          path: output_quick/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
