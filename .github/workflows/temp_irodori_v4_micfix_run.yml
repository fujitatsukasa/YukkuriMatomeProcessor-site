name: Temporary Irodori v4 microphone-quality run

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  smoke:
    if: startsWith(github.head_ref, 'tmp/irodori-v4-micfix-run-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test public raw access to the existing exact-voice generator
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/fujitatsukasa/kanjou_bunseki/tmp/irodori-v4-same16-micfix-20260806/tools/irodori_v4_micfix_wrapper.py' -o /tmp/wrapper.py
          curl -fsSL 'https://raw.githubusercontent.com/fujitatsukasa/kanjou_bunseki/tmp/irodori-fix16-20260805/tools/generate_irodori_fix16_voice.py' -o /tmp/base.py
          wc -c /tmp/wrapper.py /tmp/base.py
          python -m py_compile /tmp/wrapper.py /tmp/base.py
