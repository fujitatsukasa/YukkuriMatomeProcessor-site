name: Temporary Irodori v4 microphone-quality run

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  smoke:
    if: startsWith(github.head_ref, 'tmp/irodori-v4-micfix-run-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: echo 'runner-ready'
