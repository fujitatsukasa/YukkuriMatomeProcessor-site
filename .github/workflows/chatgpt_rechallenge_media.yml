name: ChatGPT Rechallenge Tokyo media

on:
  pull_request:
    branches: [main]
    paths:
      - '.chatgpt_rechallenge_media_trigger'
      - 'scripts/collect_rechallenge_media.py'
      - '.github/workflows/chatgpt_rechallenge_media.yml'

permissions:
  contents: read

jobs:
  fetch-media:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ffmpeg
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pillow yt-dlp
      - name: Collect public real media
        run: python scripts/collect_rechallenge_media.py
      - name: Upload collected media
        uses: actions/upload-artifact@v4
        with:
          name: rechallenge-tokyo-media
          path: output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
