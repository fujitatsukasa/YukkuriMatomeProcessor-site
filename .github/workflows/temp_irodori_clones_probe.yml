name: Temporary Irodori clones sample parquet probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.head_ref, 'tmp/irodori-clones-probe-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade huggingface_hub hf_xet pyarrow
      - name: Download one exact speaker file and inspect schema and emotion cues
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download

          repo='SynDataLab/irodori-clones-3m'
          filename='data/train-02195-of-10000.parquet'
          path=Path(hf_hub_download(repo_id=repo,repo_type='dataset',filename=filename,local_dir='probe_download'))
          pf=pq.ParquetFile(path)
          table=pq.read_table(path)
          rows=table.to_pylist()
          emojis=['😊','😆','😠','😒','😭','🥺','😰','😱','😪','🥱','😴','🫶','😟','🐢','📖','🤭','😮‍💨','😌','🙏','👌']
          counts={e:sum(e in str(r.get('text','')) for r in rows) for e in emojis}
          samples={e:[str(r.get('text','')) for r in rows if e in str(r.get('text',''))][:5] for e in emojis}
          first=rows[0].copy() if rows else None
          if isinstance(first,dict) and 'audio' in first:
              audio=first['audio']
              first['audio']={'type':type(audio).__name__,'keys':list(audio) if isinstance(audio,dict) else None}
          payload={'file':filename,'size':path.stat().st_size,'schema':str(pf.schema_arrow),'rows':len(rows),'first_row':first,'emoji_counts':counts,'emoji_samples':samples,'all_texts':[str(r.get('text','')) for r in rows]}
          out=Path('probe_output'); out.mkdir(exist_ok=True)
          (out/'sample_parquet_probe.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          print(json.dumps({k:payload[k] for k in ['file','size','schema','rows','first_row','emoji_counts']},ensure_ascii=False,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: irodori-clones-sample-probe
          path: probe_output/
          if-no-files-found: error
          retention-days: 1
