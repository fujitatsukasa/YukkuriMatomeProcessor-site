name: ChatGPT Rechallenge Tokyo high-res screens

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/capture_rechallenge_pages.py'
      - '.github/workflows/chatgpt_rechallenge_screens.yml'

permissions:
  contents: read

jobs:
  capture-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install requests pillow playwright
          python -m playwright install --with-deps chromium
      - name: Capture real public pages and linked source files
        run: python scripts/capture_rechallenge_pages.py
      - name: Upload high-resolution source captures
        uses: actions/upload-artifact@v4
        with:
          name: rechallenge-tokyo-high-res-screens
          path: output_screens/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
