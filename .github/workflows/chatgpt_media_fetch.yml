name: ChatGPT media fetch

on:
  pull_request:
    branches: [main]
    paths:
      - '.chatgpt_media_trigger'

permissions:
  contents: read

jobs:
  fetch-media:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/chatgpt_media_fetch.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ffmpeg
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pillow yt-dlp
      - name: Fetch public source media
        run: python tools/chatgpt_media_fetch.py
      - name: Upload collected media
        uses: actions/upload-artifact@v4
        with:
          name: fukuoka-assembly-media
          path: output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
