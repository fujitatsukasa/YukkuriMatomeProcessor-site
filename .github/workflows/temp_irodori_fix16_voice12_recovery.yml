name: Temporary Irodori voice 12 recovery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  recover:
    if: startsWith(github.head_ref, 'tmp/irodori-fix16-voice12-recovery-')
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      VOICE_INDEX: '12'
      HF_XET_HIGH_PERFORMANCE: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '600'
      TOKENIZERS_PARALLELISM: 'false'
      GENERATOR_COMMIT: '68baea7fa3393386b309275c241bc1347ee7f485'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch exact generator and create short-script recovery wrapper
        run: |
          mkdir -p tools
          curl -fsSL "https://raw.githubusercontent.com/fujitatsukasa/fujitatsukasa.github.io/${GENERATOR_COMMIT}/tools/irodori_fix16_spec.py" -o tools/irodori_fix16_spec.py
          curl -fsSL "https://raw.githubusercontent.com/fujitatsukasa/fujitatsukasa.github.io/${GENERATOR_COMMIT}/tools/generate_irodori_fix16_public.py" -o tools/generate_irodori_fix16_public.py
          curl -fsSL "https://raw.githubusercontent.com/fujitatsukasa/fujitatsukasa.github.io/${GENERATOR_COMMIT}/tools/generate_irodori_final_delivery.py" -o tools/generate_irodori_final_delivery.py
          curl -fsSL "https://raw.githubusercontent.com/fujitatsukasa/fujitatsukasa.github.io/${GENERATOR_COMMIT}/tools/irodori_final_delivery_spec.py" -o tools/irodori_final_delivery_spec.py
          cat > tools/run_voice12_recovery.py <<'PY'
          import os
          import sys

          requested = os.environ["VOICE_INDEX"]
          sys.path.insert(0, "../tools")
          os.environ["VOICE_INDEX"] = "0"
          import generate_irodori_final_delivery  # noqa: F401
          os.environ["VOICE_INDEX"] = requested
          import generate_irodori_fix16_public as fix

          replacements = {
              1: ("こちらを、みてください。", "こちらを、みてください。"),
              2: ("ねえ、いっしょに、かえろう。", "ねえ、いっしょに、かえろう。"),
              3: ("やった。ほんとうに、うれしい。", "やった。ほんとうに、うれしい。😊"),
              4: ("もう、やめて。", "もう、やめて。😠"),
              5: ("ごめん。きょうは、つらいの。", "ごめん。きょうは、つらいの。😭"),
              6: ("まって。だれか、いる。", "まって。だれか、いる。😰"),
              7: ("ごめん。まだ、ねむいの。", "ごめん。まだ、ねむいの。😪😮‍💨"),
              8: ("むりしなくて、いいよ。", "むりしなくて、いいよ。🫶😟"),
              9: ("きょうは、しずかで、いいな。", "きょうは、しずかで、いいな。🐢📖"),
              10: ("ふふっ。わかってるよ。", "ふふっ。わかってるよ。🤭"),
          }
          for style in fix.STYLES:
              spoken, model_input = replacements[int(style["number"])]
              style["text"] = spoken
              style["input_text"] = model_input
              style["short"] = spoken.replace("。", "").replace("、", "")
              style["candidate_count"] = 8
              style["acting_minimum"] = max(0.38, float(style.get("acting_minimum", 0.0)) - 0.08)

          fix.main()
          PY

      - name: Install official Irodori and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 git
          python -m pip install --upgrade pip uv
          git clone --depth 1 https://github.com/Aratako/Irodori-TTS.git Irodori-TTS
          cd Irodori-TTS
          uv sync --extra cpu
          uv pip install 'setuptools<81' faster-whisper rapidfuzz pykakasi scipy soundfile huggingface_hub hf_xet pyarrow resemblyzer webrtcvad librosa

      - name: Recover exact original voice 21 with short, matched lines
        run: |
          cd Irodori-TTS
          uv run --no-sync python ../tools/run_voice12_recovery.py

      - name: Upload recovered voice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irodori-fix16-recovery-voice-12
          path: fix16_public_output/voice_12/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
